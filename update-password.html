<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Contraseña - FastAPI y Keycloak</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/update-password.css">
</head>
<body>
    <div class="register-card">
        <h2>Actualizar Contraseña</h2>
        <form id="updateForm">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" placeholder="Ej. estudiante" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" placeholder="Ej. nuevaContraseña123" required>
            </div>
            <button type="submit" class="btn-submit">Actualizar</button>
            <div id="successMsg" class="msg success-msg">¡Contraseña actualizada con éxito!</div>
            <div id="errorMsg" class="msg error-msg">Hubo un error al actualizar la contraseña</div>
        </form>

        <div class="back-link">
            <a href="index.html">← Volver al Iniciar Sesión</a>
        </div>
    </div>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="/js/update-password.js"></script>
</body>
</html>
