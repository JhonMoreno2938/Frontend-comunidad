<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <!-- Barra Superior -->
    <header class="navbar">
        <div class="navbar-brand">Panel de Usuario</div>
        <div class="navbar-user-section">
            <span class="user-label">
                <span class="user-label-text">Usuario: </span>
                <strong id="userDisplay" class="user-highlight"></strong>
            </span>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="dashboard-container">
            <!-- Cuadrícula de tarjetas -->
            <div class="cards-grid">

                <!-- Tarjeta 1: Viajes (Servicio B) -->
                <a href="#" id="linkViajes" class="nav-card">
                    <img src="img/images.jpg" alt="Gestión" class="card-img">
                    <div class="card-title">Viajes</div>
                </a>

                <!-- Tarjeta 2: Historial (Servicio C - futuro) -->
                <a href="#" id="linkHistorial" class="nav-card">
                    <img src="img/images.jpg" alt="Historial" class="card-img">
                    <div class="card-title">Historial / Auditoría</div>
                </a>

                <!-- Tarjeta 3: Nuevo Registro (Servicio D - futuro) -->
                <a href="#" id="linkRegistro" class="nav-card">
                    <img src="img/images.jpg" alt="Registro" class="card-img">
                    <div class="card-title">Nuevo Registro</div>
                </a>
            </div>
        </div>
    </main>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="/js/dashboard.js"></script>
</body>

</html>
