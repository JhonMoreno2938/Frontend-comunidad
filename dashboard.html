<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .dashboard-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #2d3748; }
        .user-highlight {
            color: #667eea;
            font-weight: bold;
        }
        p { color: #718096; }
        .btn-logout {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #e53e3e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-logout:hover {
            background: #c53030;
        }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h1>¡Bienvenido!</h1>
        <p>Has iniciado sesión exitosamente como: <span id="userDisplay" class="user-highlight"></span></p>
        <p style="font-size: 12px; color: #a0aec0;">Keycloak autenticó tus credenciales correctamente.</p>
        <a href="index.html" class="btn-logout" onclick="localStorage.clear()">Cerrar Sesión</a>
    </div>

    <script>
        // Recuperamos el nombre de usuario guardado al iniciar sesión
        const loggedUser = localStorage.getItem('username');
        
        if (!loggedUser) {
            // Si alguien intenta entrar aquí sin loguearse, lo devolvemos al login
            window.location.href = 'index.html';
        } else {
            document.getElementById('userDisplay').innerText = loggedUser;
        }
    </script>
</body>
</html>
