<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <!-- Barra Superior -->
    <header class="navbar">
        <div class="navbar-brand">Panel de Usuario</div>
        <div class="navbar-user-section">
            <span class="user-label">
                <span class="user-label-text">Usuario: </span>
                <strong id="userDisplay" class="user-highlight"></strong>
            </span>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="dashboard-container">
            <!-- Cuadrícula de tarjetas -->
            <div class="cards-grid">
                
                <!-- Tarjeta 1: Viajes (Apuntando al Servicio B) -->
                <!-- Le quitamos el href fijo y le ponemos un id para que JS lo maneje -->
                <a href="#" id="linkViajes" class="nav-card">
                    <img src="img/images.jpg" alt="Gestión" class="card-img">
                    <div class="card-title">Viajes</div>
                </a>

                <!-- Tarjeta 2: Historial -->
                <a href="historial.html" class="nav-card">
                    <img src="img/images.jpg" alt="Historial" class="card-img">
                    <div class="card-title">Historial / Auditoría</div>
                </a>

                <!-- Tarjeta 3: Nuevo Registro -->
                <a href="register.html" class="nav-card">
                    <img src="img/images.jpg" alt="Registro" class="card-img">
                    <div class="card-title">Nuevo Registro</div>
                </a>
            </div>
        </div>
    </main>

    <!-- Vinculamos el archivo JavaScript externo (si tienes uno, ej: dashboard.js) -->
    <script src="/js/dashboard.js"></script>

    <!-- Script para construir dinámicamente el enlace al Servicio B -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Obtenemos el usuario. 
            // Intentamos leer de localStorage. Si no está, lo tomamos de la URL actual (por si acaso).
            // Si no, usamos 'usuario31' como fallback.
            const urlParams = new URLSearchParams(window.location.search);
            const usuario = localStorage.getItem('usuario') 
                         || localStorage.getItem('preferred_username') 
                         || urlParams.get('usuario') 
                         || 'usuario31';

            // 2. Mostramos el usuario en la barra superior
            const userDisplay = document.getElementById('userDisplay');
            if (userDisplay) {
                userDisplay.innerText = usuario;
            }

            // 3. Construimos la URL del Servicio B pasando el usuario como parámetro
            // ¡Aquí está la magia! Se pasa ?usuario=usuario31 al Servicio B
            const urlServicioB = `http://192.168.0.107:3001/?usuario=${encodeURIComponent(usuario)}`;
            
            // 4. Asignamos esa URL al enlace de la tarjeta "Viajes"
            const linkViajes = document.getElementById('linkViajes');
            if (linkViajes) {
                linkViajes.href = urlServicioB;
                console.log('Enlace a Servicio B configurado:', urlServicioB);
            }
        });
    </script>
</body>

</html>
