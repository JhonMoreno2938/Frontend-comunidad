<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FastAPI y Keycloak</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <main class="login-card">
        <h2>Iniciar Sesión</h2>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ej. estudiante"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ej. 123456"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>

            <div id="errorMsg" class="error-msg" role="alert">
                Usuario o contraseña incorrectos
            </div>
        </form>

        <!-- Enlace de recuperación de contraseña -->
        <div class="register-link">
            <a href="update-password.html">¿Olvidaste tu contraseña? Actualizar aquí</a>
        </div>
    </main>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="/js/login.js"></script>
</body>
</html>
