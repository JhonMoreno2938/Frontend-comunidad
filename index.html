<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FastAPI y Keycloak</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej. estudiante" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ej. 123456" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
            <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</div>
        </form>

        <!-- Enlace para ir a la vista de creación de cuenta -->
        <div class="register-link">
            <a href="register.html">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.style.display = 'none';

            // Apuntamos al endpoint de tu API en FastAPI
            const apiUrl = 'http://localhost:8000/api/auth/login';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Almacenamos el token devuelto por tu API
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('username', usernameInput);

                    // Redirección exitosa al dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    const errorData = await response.json();
                    errorDiv.innerText = errorData.detail || 'Usuario o contraseña incorrectos';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error de conexión con la API:', error);
                errorDiv.innerText = 'Error al conectar con el servidor';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
