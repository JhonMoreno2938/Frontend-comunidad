<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Registro</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="register-card">
        <h2>Crear Cuenta</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="newUsername">Nombre de Usuario</label>
                <input type="text" id="newUsername" placeholder="Ej. nuevo_usuario" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Contraseña</label>
                <input type="password" id="newPassword" placeholder="Ej. contraseña123" required>
            </div>
            <button type="submit" class="btn-submit">Guardar</button>
            <div id="successMsg" class="msg success-msg">¡Usuario registrado con éxito!</div>
            <div id="errorMsg" class="msg error-msg">Hubo un error al registrar el usuario</div>
        </form>

        <div class="back-link">
            <a href="index.html">← Volver al Iniciar Sesión</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('newUsername').value;
            const passwordInput = document.getElementById('newPassword').value;
            const successDiv = document.getElementById('successMsg');
            const errorDiv = document.getElementById('errorMsg');

            successDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                // Petición hacia tu API de Python en el puerto 8000
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                if (response.ok) {
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    const errData = await response.json();
                    errorDiv.innerText = errData.detail || 'Error al registrar el usuario';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                errorDiv.innerText = 'No se pudo conectar con la API de Python';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
